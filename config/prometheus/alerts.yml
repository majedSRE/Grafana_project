# The Compose deployment mounts this single file at /etc/prometheus/alerts.yml.
# Keep platform and application rules as separate groups here so the existing
# deployment path remains compatible without requiring a Compose change.
groups:
  - name: platform-alerts
    interval: 30s
    rules:
      - alert: MonitoringTargetDown
        expr: up{monitoring_scope="platform"} == 0
        for: 2m
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Monitoring Target Down"
          description: "{{ $labels.job }} at {{ $labels.instance }} has been unavailable for more than two minutes; inspect the target, service logs, and network path."

      - alert: HostHighCpu
        expr: 100 - (avg by (instance, server, environment, job, monitoring_scope) (rate(node_cpu_seconds_total{job="linux-server", monitoring_scope="platform", mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "Platform High CPU Utilization"
          description: "Platform CPU utilization on {{ $labels.instance }} has exceeded 90% for ten minutes; inspect host processes and platform container CPU consumers."

      - alert: HostLowMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="linux-server", monitoring_scope="platform"} / node_memory_MemTotal_bytes{job="linux-server", monitoring_scope="platform"}) > 90
        for: 5m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "Platform High Memory Utilization"
          description: "Platform memory utilization on {{ $labels.instance }} has exceeded 90% for five minutes; inspect platform container working sets and host memory pressure."

      - alert: PlatformDiskUtilizationWarning
        expr: |
          (
            100 * (
              1 -
              node_filesystem_avail_bytes{
                job="linux-server",
                monitoring_scope="platform",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
              /
              node_filesystem_size_bytes{
                job="linux-server",
                monitoring_scope="platform",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
            )
          ) > 80
          and
          (
            100 * (
              1 -
              node_filesystem_avail_bytes{
                job="linux-server",
                monitoring_scope="platform",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
              /
              node_filesystem_size_bytes{
                job="linux-server",
                monitoring_scope="platform",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
            )
          ) <= 90
        for: 10m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "Platform Disk Utilization Warning"
          description: "Platform filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is more than 80% utilized but not above 90%; inspect retention, logs, and telemetry disk usage."

      - alert: PlatformDiskUtilizationCritical
        expr: |
          100 * (
            1 -
            node_filesystem_avail_bytes{
              job="linux-server",
              monitoring_scope="platform",
              fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
            }
            /
            node_filesystem_size_bytes{
              job="linux-server",
              monitoring_scope="platform",
              fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
            }
          ) > 90
        for: 5m
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Platform Disk Utilization Critical"
          description: "Platform filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is more than 90% utilized; inspect retention, logs, and telemetry disk capacity immediately."

      - alert: PrometheusRuleEvaluationFailures
        expr: sum(increase(prometheus_rule_evaluation_failures_total[10m])) > 0
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Prometheus rule evaluations are failing"
          description: "Prometheus recorded a rule-evaluation failure in the last ten minutes; inspect Prometheus logs and the failing rule group before relying on alert results."

      - alert: PrometheusNotificationErrors
        expr: sum(increase(prometheus_notifications_errors_total[10m])) > 0
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "Prometheus notification errors occurred"
          description: "Prometheus recorded notification errors in the last ten minutes; inspect the Alertmanager target and Prometheus notification logs."

      - alert: PrometheusNotificationsDropped
        expr: sum(increase(prometheus_notifications_dropped_total[10m])) > 0
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Prometheus notifications were dropped"
          description: "Prometheus dropped notifications in the last ten minutes; inspect Alertmanager reachability, queue pressure, and notification logs."

      - alert: PrometheusTSDBCompactionFailures
        expr: sum(increase(prometheus_tsdb_compactions_failed_total[10m])) > 0
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Prometheus TSDB compaction failed"
          description: "Prometheus recorded a TSDB compaction failure in the last ten minutes; inspect disk space, permissions, and Prometheus storage logs."

      - alert: AlloyConfigLoadFailure
        expr: sum(increase(alloy_config_load_failures_total[10m])) > 0
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Grafana Alloy configuration failed to load"
          description: "Alloy recorded a configuration-load failure in the last ten minutes; inspect Alloy logs and validate the deployed configuration before restarting it."

      - alert: CAdvisorScrapeFailure
        expr: max(container_scrape_error{job="cadvisor", monitoring_scope="platform"}) > 0
        for: 5m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "cAdvisor Scrape Failure"
          description: "cAdvisor has reported a container scrape failure for five minutes; inspect cAdvisor logs and Docker/container health."

      - alert: ContainerHighMemory
        expr: |
          (
            100 *
            sum by (container_label_com_docker_compose_service) (
              container_memory_working_set_bytes{
                job="cadvisor",
                monitoring_scope="platform",
                container_label_com_docker_compose_project="observability-test",
                container_label_com_docker_compose_service!=""
              }
            )
            /
            sum by (container_label_com_docker_compose_service) (
              container_spec_memory_limit_bytes{
                job="cadvisor",
                monitoring_scope="platform",
                container_label_com_docker_compose_project="observability-test",
                container_label_com_docker_compose_service!=""
              } > 0
            )
          ) > 90
        for: 10m
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "Platform Container High Memory"
          description: "Compose service {{ $labels.container_label_com_docker_compose_service }} has exceeded 90% of its configured cAdvisor memory limit for ten minutes; inspect its workload, logs, and memory limit."

      - alert: LokiWALCorruption
        expr: sum(increase(loki_ingester_wal_corruptions_total[10m])) > 0
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Loki WAL corruption was detected"
          description: "Loki recorded WAL corruption in the last ten minutes; inspect Loki logs and the telemetry disk before relying on recent log durability."

      - alert: LokiWALDiskFull
        expr: sum(increase(loki_ingester_wal_disk_full_failures_total[10m])) > 0
        labels:
          category: platform
          severity: critical
        annotations:
          summary: "Loki WAL writes encountered a full disk"
          description: "Loki recorded a WAL disk-full failure in the last ten minutes; inspect telemetry filesystem capacity and retention immediately."

      - alert: LokiChunkFlushFailures
        expr: sum(increase(loki_ingester_chunks_flush_failures_total[10m])) > 0
        labels:
          category: platform
          severity: warning
        annotations:
          summary: "Loki chunk flushes are failing"
          description: "Loki recorded chunk-flush failures in the last ten minutes; inspect Loki logs, object/filesystem storage, and disk capacity."

  - name: asset-alerts
    interval: 30s
    rules:
      - alert: AssetServerDown
        expr: up{monitoring_scope="asset"} == 0
        for: 2m
        labels:
          category: asset
          severity: critical
        annotations:
          summary: "Server Down"
          description: "External monitored server {{ $labels.server }} at {{ $labels.instance }} has been unavailable for more than two minutes; inspect the asset host, exporter, and network path."

      - alert: AssetRecentlyRebooted
        expr: |
          (
            time() - node_boot_time_seconds{monitoring_scope="asset"} < 900
          )
          and
          (
            time() - node_boot_time_seconds{monitoring_scope="asset"} >= 0
          )
        labels:
          category: asset
          severity: info
        annotations:
          summary: "Server Recently Rebooted"
          description: "External monitored server {{ $labels.server }} booted within the last 15 minutes; confirm the reboot was expected."

      - alert: AssetHighCPUUtilization
        expr: 100 - (avg by (instance, server, environment, job, monitoring_scope) (rate(node_cpu_seconds_total{monitoring_scope="asset", mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          category: asset
          severity: warning
        annotations:
          summary: "High CPU Utilization"
          description: "External monitored server {{ $labels.server }} CPU utilization has exceeded 90% for ten minutes; inspect host processes and workload consumers."

      - alert: AssetHighMemoryUtilization
        expr: 100 * (1 - node_memory_MemAvailable_bytes{monitoring_scope="asset"} / node_memory_MemTotal_bytes{monitoring_scope="asset"}) > 90
        for: 5m
        labels:
          category: asset
          severity: warning
        annotations:
          summary: "High Memory Utilization"
          description: "External monitored server {{ $labels.server }} memory utilization has exceeded 90% for five minutes; inspect workload memory pressure."

      - alert: AssetDiskUtilizationWarning
        expr: |
          (
            100 * (
              1 -
              node_filesystem_avail_bytes{
                monitoring_scope="asset",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
              /
              node_filesystem_size_bytes{
                monitoring_scope="asset",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
            )
          ) > 80
          and
          (
            100 * (
              1 -
              node_filesystem_avail_bytes{
                monitoring_scope="asset",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
              /
              node_filesystem_size_bytes{
                monitoring_scope="asset",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
              }
            )
          ) <= 90
        for: 10m
        labels:
          category: asset
          severity: warning
        annotations:
          summary: "Disk Utilization Warning"
          description: "External monitored server {{ $labels.server }} filesystem {{ $labels.mountpoint }} is more than 80% utilized but not above 90%; inspect disk growth and retention."

      - alert: AssetDiskUtilizationCritical
        expr: |
          100 * (
            1 -
            node_filesystem_avail_bytes{
              monitoring_scope="asset",
              fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
            }
            /
            node_filesystem_size_bytes{
              monitoring_scope="asset",
              fstype!~"tmpfs|devtmpfs|overlay|squashfs|proc|sysfs|cgroup|cgroup2|tracefs|debugfs|securityfs|pstore|autofs|mqueue|hugetlbfs|fusectl|configfs|ramfs"
            }
          ) > 90
        for: 5m
        labels:
          category: asset
          severity: critical
        annotations:
          summary: "Disk Utilization Critical"
          description: "External monitored server {{ $labels.server }} filesystem {{ $labels.mountpoint }} is more than 90% utilized; inspect disk capacity immediately."

  - name: application-alerts
    interval: 30s
    rules:
      - alert: ApplicationServiceHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (service_name, le) (
              rate(
                traces_span_metrics_duration_seconds_bucket{
                  service_namespace="retail-store",
                  span_kind="SPAN_KIND_SERVER"
                }[5m]
              )
            )
          ) > 0.5
        for: 5m
        labels:
          category: application
          severity: warning
          team: application
        annotations:
          summary: "High Service Latency"
          description: "{{ $labels.service_name }} has server-transaction P95 latency above 0.5 seconds for five minutes; inspect the slow spans and downstream dependencies. Observed P95: {{ $value }} seconds."

      - alert: ApplicationServiceHighErrorRate
        expr: |
          100 *
          sum by (service_name) (
            rate(
              traces_span_metrics_calls_total{
                service_namespace="retail-store",
                span_kind="SPAN_KIND_SERVER",
                status_code="STATUS_CODE_ERROR"
              }[5m]
            )
          )
          /
          clamp_min(
            sum by (service_name) (
              rate(
                traces_span_metrics_calls_total{
                  service_namespace="retail-store",
                  span_kind="SPAN_KIND_SERVER"
                }[5m]
              )
            ),
            0.001
          ) > 5
        for: 5m
        labels:
          category: application
          severity: critical
          team: application
        annotations:
          summary: "High Error Rate"
          description: "{{ $labels.service_name }} has exceeded 5% failed server transactions for five minutes; inspect the affected service traces and correlated application logs. Observed error rate: {{ $value }}%."

      - alert: ApplicationTransactionFailures
        expr: |
          sum by (service_name) (
            increase(
              traces_span_metrics_calls_total{
                service_namespace="retail-store",
                span_kind="SPAN_KIND_SERVER",
                status_code="STATUS_CODE_ERROR"
              }[5m]
            )
          ) > 0
        labels:
          category: application
          severity: warning
          team: application
        annotations:
          summary: "Transaction Failure"
          description: "{{ $labels.service_name }} recorded {{ $value }} failed server transactions in the last five minutes; inspect the corresponding traces and application logs."
