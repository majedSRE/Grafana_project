apiVersion: 1

providers:
  - name: octosight-platform
    orgId: 1
    folder: OctoSight Platform
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /etc/grafana/provisioning/dashboards/platform

  - name: monitored-assets
    orgId: 1
    folder: Monitored Assets
    type: file
    disableDeletion: true
    editable: false
    options:
      path: /etc/grafana/provisioning/dashboards/monitored-assets
