name: Validate observability platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Compose model
        run: docker compose --env-file .env.example -f docker-compose.yml -f images.lock.yml -f tests/compose.local.yml -p observability-validation config --quiet

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate
          terraform test

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm -v "$PWD/config/prometheus:/etc/prometheus:ro" prom/prometheus:v3.14.0 \
            promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/config/prometheus:/etc/prometheus:ro" prom/prometheus:v3.14.0 \
            promtool check rules /etc/prometheus/alerts.yml

      - name: Scan repository for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-files: terraform/tests/infrastructure.tftest.hcl
          exit-code: "1"
